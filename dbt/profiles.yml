datacenter:
  target: production
  outputs:
    production:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOSTNAME') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_KEY') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA') }}"
      threads: 4
