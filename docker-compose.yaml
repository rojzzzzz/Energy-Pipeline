services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build: .
    user: "${AIRFLOW_UID:-1000}:0"
    working_dir: /opt/project
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__API__WORKERS: "1"
      PYTHONPATH: /opt/project/src
      DBT_EXECUTABLE: /home/airflow/dbt-venv/bin/dbt
      DBT_PROJECT_DIR: /opt/project/dbt
      DBT_PROFILES_DIR: /opt/project/dbt
      DBT_TARGET_PATH: /opt/project/logs/dbt/target
      DBT_LOG_PATH: /opt/project/logs/dbt
      DBT_ENV_SECRET_DATABRICKS_KEY: "${DATABRICKS_KEY}"
    command: standalone
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/project/src:ro
      - ./dbt:/opt/project/dbt:ro
      - ./data:/opt/project/data
      - ./logs:/opt/project/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; h = json.load(urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')); assert all(v['status'] == 'healthy' for v in h.values() if isinstance(v, dict) and 'status' in v), h"
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  metabase-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
    volumes:
      - metabase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
    depends_on:
      metabase-db:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-home:
  metabase-data:
