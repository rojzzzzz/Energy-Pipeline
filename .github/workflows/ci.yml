name: CI

on:
  push:
    branches: ["main"]
  
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
  
  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t energy:pipeline .

  dbt:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dbt
        run: python -m pip install "dbt-core==1.12.5" "dbt-databricks==1.12.7"

      - name: Parse dbt project
        working-directory: dbt
        env:
          DATABRICKS_HOSTNAME: ci.invalid
          DATABRICKS_HTTP: /sql/1.0/warehouses/ci
          DBT_ENV_SECRET_DATABRICKS_KEY: ci-placeholder
          DATABRICKS_CATALOG: ci
          DATABRICKS_SCHEMA: silver
        run: dbt parse --profiles-dir .
